services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cortex_db
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: cortex_api
    environment:
      DATABASE_URL: postgresql+psycopg://cortex:cortex@db:5432/cortex
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"


volumes:
  pgdata:

